// ============================================================
// CLOUDS
// ============================================================
let cloudMesh;
function createClouds() {
  let geo = new THREE.BufferGeometry();
  let positions = [];
  for (let i = 0; i < 50; i++) {
    let cx = (Math.random() - 0.5) * 200;
    let cz = (Math.random() - 0.5) * 200;
    let cy = 50 + Math.random() * 5;
    let w = 5 + Math.random() * 15;
    let d = 3 + Math.random() * 8;
    for (let x = 0; x < w; x += 2) {
      for (let z = 0; z < d; z += 2) {
        if (Math.random() > 0.3) {
          let bx = cx + x, bz = cz + z;
          positions.push(
            bx, cy, bz, bx+2, cy, bz, bx+2, cy+1, bz,
            bx, cy, bz, bx+2, cy+1, bz, bx, cy+1, bz,
            bx, cy+1, bz, bx+2, cy+1, bz, bx+2, cy+1, bz+2,
            bx, cy+1, bz, bx+2, cy+1, bz+2, bx, cy+1, bz+2,
          );
        }
      }
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  let mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
  cloudMesh = new THREE.Mesh(geo, mat);
  scene.add(cloudMesh);
}

// ============================================================
// STARS
// ============================================================
let starsMesh;
function createStars() {
  let geo = new THREE.BufferGeometry();
  let positions = [];
  for (let i = 0; i < 500; i++) {
    let theta = Math.random() * Math.PI * 2;
    let phi = Math.random() * Math.PI;
    let r = 200;
    positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  starsMesh = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }));
  scene.add(starsMesh);
}

// ============================================================
// MAIN INIT AND LOOP
// ============================================================
async function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0.5, 0.7, 1.0);
  scene.fog = new THREE.Fog(0x87CEEB, 40, RENDER_DIST * CHUNK_SIZE);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
  scene.add(camera);

  let canvas = document.createElement('canvas');
  let gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  document.body.appendChild(renderer.domElement);

  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    console.log('WebGL context lost — pausing render');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      gameLoopPaused = true;
      console.log('Tab hidden — pausing game loop');
    } else {
      gameLoopPaused = false;
      clock.getDelta(); // discard elapsed time
      console.log('Tab visible — resuming game loop');
    }
  });
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    console.log('WebGL context restored — rebuilding');
    buildTextureAtlas();
    for (let key in chunks) { chunks[key].mesh = null; }
    let cx = Math.floor(playerPos.x / CHUNK_SIZE), cz = Math.floor(playerPos.z / CHUNK_SIZE);
    for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++)
      for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++)
        buildChunkMesh(cx + dx, cz + dz);
  });

  sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
  sunLight.position.set(50, 80, 30);
  scene.add(sunLight);

  ambientLight = new THREE.AmbientLight(0x606080, 0.5);
  scene.add(ambientLight);

  clock = new THREE.Clock();

  buildTextureAtlas();
  createHandMesh();
  createClouds();
  createStars();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function generateWorld(progressCb) {
  let seed = Math.random() * 10000;
  noiseGen = new SimplexNoise(seed);
  noiseGen2 = new SimplexNoise(seed + 1);
  noiseGen3 = new SimplexNoise(seed + 2);

  let totalChunks = (RENDER_DIST * 2 + 1) ** 2;
  let done = 0;

  for (let cx = -RENDER_DIST; cx <= RENDER_DIST; cx++) {
    for (let cz = -RENDER_DIST; cz <= RENDER_DIST; cz++) {
      generateChunk(cx, cz);
      done++;
    }
  }

  for (let cx = -RENDER_DIST; cx <= RENDER_DIST; cx++) {
    for (let cz = -RENDER_DIST; cz <= RENDER_DIST; cz++) {
      buildChunkMesh(cx, cz);
    }
  }

  // Spawn animals
  for (let i = 0; i < 20; i++) {
    let ax = (Math.random() - 0.5) * RENDER_DIST * CHUNK_SIZE;
    let az = (Math.random() - 0.5) * RENDER_DIST * CHUNK_SIZE;
    let ah = getHeight(Math.floor(ax), Math.floor(az));
    if (ah > SEA_LEVEL) {
      let types = ['pig', 'cow', 'chicken', 'sheep'];
      spawnAnimal(Math.floor(ax), ah + 1, Math.floor(az), types[(Math.random() * 4) | 0]);
    }
  }

  // Set player pos - clear a wide area around spawn
  let spawnH = getHeight(0, 0);
  playerPos.y = spawnH + 1 + PLAYER_EYE_HEIGHT + 0.5;
  for (let sx = -3; sx <= 3; sx++)
    for (let sz = -3; sz <= 3; sz++)
      for (let sy = spawnH + 1; sy <= spawnH + 8; sy++)
        setBlock(sx, sy, sz, 0);
  rebuildNearbyChunks(0, 0);
}

let lastChunkX = -999, lastChunkZ = -999;

function updateChunks() {
  let cx = Math.floor(playerPos.x / CHUNK_SIZE);
  let cz = Math.floor(playerPos.z / CHUNK_SIZE);
  if (cx === lastChunkX && cz === lastChunkZ) return;
  lastChunkX = cx; lastChunkZ = cz;

  for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++) {
    for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++) {
      let key = chunkKey(cx + dx, cz + dz);
      if (!chunks[key]) {
        generateChunk(cx + dx, cz + dz);
        buildChunkMesh(cx + dx, cz + dz);
      }
    }
  }

  // Remove distant chunks
  for (let key in chunks) {
    let [ccx, ccz] = key.split(',').map(Number);
    if (Math.abs(ccx - cx) > RENDER_DIST + 1 || Math.abs(ccz - cz) > RENDER_DIST + 1) {
      if (chunks[key].mesh) {
        scene.remove(chunks[key].mesh);
        chunks[key].mesh.geometry.dispose();
      }
      delete chunks[key];
    }
  }
}

function gameLoop() {
  requestAnimationFrame(gameLoop);
  if (gameLoopPaused || renderer.getContext().isContextLost()) return;
  let dt = Math.min(clock.getDelta(), 0.05);

  if (!gameStarted || paused) {
    try { renderer.render(scene, camera); } catch(e) {}
    return;
  }

  updatePlayer(dt);
  updateBlockInteraction(dt);
  updateHandAnimation(dt);
  updateBreakOverlay();
  updateDayNight(dt);
  updateAnimals(dt);
  updateDroppedItems(dt);
  updateChunks();
  if (!window._lastSave) window._lastSave = 0;
  window._lastSave += dt;
  if (window._lastSave > 30) { window._lastSave = 0; saveGame(); }
  updateTooltip();
  updateHealthBar();
  updateFoodBar();

  // Cloud movement
  if (cloudMesh) cloudMesh.position.x += dt * 0.5;

  // Stars visibility
  if (starsMesh) {
    starsMesh.visible = dayTime > 0.7 || dayTime < 0.25;
    starsMesh.position.copy(camera.position);
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  try { renderer.render(scene, camera); } catch(e) {}
}

// ============================================================
// INPUT HANDLING
// ============================================================
function setupInput() {
  document.addEventListener('keydown', e => {
    keys[e.code] = true;

    if (e.code === 'Escape') {
      if (inventoryOpen) closeInventory();
      else if (craftingOpen) closeCrafting();
      else if (paused) resumeGame();
      else pauseGame();
      return;
    }

    if (e.code === 'KeyE' && gameStarted) {
      if (craftingOpen) { closeCrafting(); return; }
      if (inventoryOpen) closeInventory();
      else openInventory();
      return;
    }

    // Hotbar keys
    if (e.code >= 'Digit1' && e.code <= 'Digit9') {
      selectedSlot = parseInt(e.code.charAt(5)) - 1;
      updateHotbar();
    }

    // Sprint
    if (e.code === 'ControlLeft') sprinting = true;

    // Eat food with right hand item
    if (e.code === 'KeyQ' && gameStarted && !inventoryOpen && !craftingOpen) {
      let held = inventory[selectedSlot];
      if (held && held.isItem && ITEMS[held.id]?.food) {
        eatFood(held);
        updateHotbar();
      }
    }

    if (e.code === 'F3') e.preventDefault();
  });

  document.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'ControlLeft') sprinting = false;
  });

  document.addEventListener('mousemove', e => {
    // Update cursor item position
    let ci = document.getElementById('cursor-item');
    if (ci) { ci.style.left = (e.clientX + 8) + 'px'; ci.style.top = (e.clientY + 8) + 'px'; }
    updateCursorItemDisplay();

    if (!gameStarted || paused || inventoryOpen || craftingOpen) return;
    if (document.pointerLockElement) {
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
    }
  });

  document.addEventListener('mousedown', e => {
    if (!gameStarted || paused) return;
    if (inventoryOpen || craftingOpen) return;
    if (!document.pointerLockElement) { requestPointerLock(); return; }
    if (e.button === 0) mouseDown = true;
    if (e.button === 2) placeBlock();
  });

  document.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDown = false;
  });

  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('wheel', e => {
    if (!gameStarted || inventoryOpen || craftingOpen) return;
    if (e.deltaY > 0) selectedSlot = (selectedSlot + 1) % 9;
    else selectedSlot = (selectedSlot + 8) % 9;
    updateHotbar();
  });
}

function requestPointerLock() {
  setTimeout(() => {
    renderer?.domElement?.requestPointerLock?.().catch?.(() => {});
  }, 100);
}

function pauseGame() {
  paused = true;
  document.getElementById('pause-menu').style.display = 'flex';
  document.exitPointerLock?.();
}

function resumeGame() {
  paused = false;
  document.getElementById('pause-menu').style.display = 'none';
  requestPointerLock();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// SAVE / LOAD SYSTEM
// ============================================================
function saveGame() {
  let saveData = {
    world: {},
    playerPos, health, food, xp, dayTime, inventory: inventory.map(s => s ? {...s} : null), selectedSlot
  };
  for (let key in world) saveData.world[key] = world[key];
  try { localStorage.setItem('minecraft_save', JSON.stringify(saveData)); } catch(e) {}
}

function loadGame() {
  try {
    let data = JSON.parse(localStorage.getItem('minecraft_save'));
    if (!data) return false;
    world = data.world || {};
    playerPos.x = data.playerPos.x; playerPos.y = data.playerPos.y; playerPos.z = data.playerPos.z;
    health = data.health || 20; food = data.food || 20; xp = data.xp || 0;
    dayTime = data.dayTime || 0.25;
    inventory = data.inventory || new Array(36).fill(null);
    selectedSlot = data.selectedSlot || 0;
    return true;
  } catch(e) { return false; }
}
